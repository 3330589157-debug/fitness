  try { localStorage.setItem("__fw_test","1"); localStorage.removeItem("__fw_test"); return localStorage; }
  catch(e){
    return { getItem:function(k){return (k in memStore)?memStore[k]:null;},
             setItem:function(k,v){memStore[k]=String(v);},
             removeItem:function(k){delete memStore[k];} };
  }
})();
function load(key,def){ try{ var v=store.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(key,val){ try{ store.setItem(key,JSON.stringify(val)); }catch(e){ alert("无法写入浏览器存储（可能被禁用），数据仅本次有效。"); } }

/* ===== 工具 ===== */
function $(id){ return document.getElementById(id); }
var DAY_MS = 86400000;
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pdate(s){ var a=s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function md(d){ return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function today(){ return startOfDay(new Date()); }
function weekOf(d){
  var w1=pdate(settings.week1);
  return Math.floor((startOfDay(d)-w1)/DAY_MS/7)+1;
}
function weekDates(w){
  var w1=pdate(settings.week1);
  var s=new Date(w1.getTime()+(w-1)*7*DAY_MS);
  var e=new Date(s.getTime()+6*DAY_MS);
  return md(s)+" ~ "+md(e);
}
function parseWeeks(spec){
  var set={};
  spec.split(",").forEach(function(part){
    var m=part.match(/^(\d+)-(\d+)$/);
    if(m){ for(var i=+m[1];i<=+m[2];i++) set[i]=1; }
    else set[+part]=1;
  });
  return set;
}
function inWeeks(spec,w){ return !!parseWeeks(spec)[w]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  html+='</div>';

  var exs=EXERCISES[trainSplit], log=train[trainDate]||{split:trainSplit,ex:{}};
  html+='<div class="card"><h2>'+SPLITS[trainSplit].name+' <span class="mut">自动保存</span></h2>';
  html+='<div class="scroll-x"><div class="scrollhint">← 左右滑动查看动作/次数 →</div><table><tr><th>动作</th><th style="width:72px">组×次</th><th style="width:110px">重量kg</th><th>每组次数/秒</th><th style="width:120px">渐进提示</th></tr>';
  exs.forEach(function(ex){
    var rec=log.ex[ex.id]||{w:"",r:[],done:false};
    html+='<tr><td><b>'+esc(ex.n)+'</b><div class="tip">备选：'+esc(ex.alt)+'<br>要点：'+esc(ex.tip)+'</div></td>';
    html+='<td>'+ex.sets+'×'+ex.lo+'-'+ex.hi+(ex.unit==="sec"?"s":"")+'</td>';
    html+='<td>'+(ex.type==="bw"?'<span class="tag rest">自重</span>':'<input type="number" class="w40" data-ex="'+ex.id+'" data-f="w" value="'+rec.w+'" step="0.5" min="0">')+'</td>';
    html+='<td><span class="row" style="gap:4px">';
    for(var i=0;i<ex.sets;i++){
      html+='<input type="number" class="w40" data-ex="'+ex.id+'" data-f="r'+i+'" value="'+(rec.r[i]!==undefined?rec.r[i]:"")+'" min="0" placeholder="'+(ex.unit==="sec"?"秒":"次")+'">';
    }
    html+='</span></td><td class="tip">'+progHint(ex)+'</td></tr>';
  });
  html+='</table></div></div>';
  $("view-training").innerHTML=html;
  $("trainDate").addEventListener("change",function(){ trainDate=this.value; renderTraining(); });
  document.querySelectorAll('#view-training input[data-ex]').forEach(function(inp){
    inp.addEventListener("input",function(){ saveTrain(inp); });
  });
}
function setSplit(k){ trainSplit=k; renderTraining(); }
function saveTrain(inp){
  var exId=inp.dataset.ex, f=inp.dataset.f, v=parseFloat(inp.value);
  if(!train[trainDate]) train[trainDate]={split:trainSplit,ex:{}};
  var rec=train[trainDate].ex;
  if(!rec[exId]) rec[exId]={w:"",r:[]};
  if(f==="w") rec[exId].w=isNaN(v)?"":v;
  else rec[exId].r[+f.slice(1)]=isNaN(v)?"":v;
  save("fw_train",train);
}
function histFor(ex){
  var dates=Object.keys(train).sort();
  var out=[];
  dates.forEach(function(dt){
    var t=train[dt], rec=t&&t.ex&&t.ex[ex.id];
    if(rec&&(rec.w!==""||rec.r.some(function(x){return x!==""&&x!==undefined;}))) out.push({date:dt,w:rec.w,r:rec.r});
  });
  return out;
}
function progHint(ex){
  if(ex.type==="bw") return "自重：先做满目标次数，再做不动时减难度/加次数";
  var h=histFor(ex);
  if(h.length===0) return "首练：从空杆/轻重量试起，找一组只能做8-12次的重量";
  var last=h[h.length-1];
  if(last.w===""||last.w===undefined||last.w===null) return "先记录重量后给出加重建议";
  var top=0, allTop=true;
  last.r.forEach(function(r){ if(r===""||r===undefined) allTop=false; else if(r>top) top=r; });
  var inc=(ex.type==="bar"||ex.type==="mac")?2.5:1.5;
  var streak=0;
  for(var i=h.length-1;i>=0;i--){
    var rec=h[i], ok=true;
    for(var j=0;j<ex.sets;j++){ var r=rec.r[j]; if(r===""||r===undefined||r<ex.hi){ ok=false; break; } }
    if(!ok) break;
    streak++;
  }
  var sug=last.w+(streak>=2?inc:0);
  return "上次 "+last.w+"kg → 下次 "+sug+"kg"+(streak>=2?"（连续2次达上限，+"+inc+"kg）":"（未连续2次达上限，先保持）");
}

function barHtml(label,val,target,unit,cls){
  var pct=Math.min(100,Math.round(val/target*100));
  var ok=val>=target;
  return '<div class="prog">'+label+' <b>'+val+'</b> / '+target+unit+' <span class="tag'+(ok?"":" warn")+'">'+(ok?"已达标":"还差 "+(target-val)+unit)+'</span></div><div class="'+cls+'"><i style="width:'+pct+'%"></i></div>';
}
function toggleDiet(id){
  if(!diet[dietDate]) diet[dietDate]={items:{}};
  var rec=diet[dietDate];
  if(rec.items[id]) delete rec.items[id]; else rec.items[id]=1;
  save("fw_diet",diet);
  renderDiet();
}
function entryMacros(id,val){
  if(val&&typeof val==="object") return {p:val.p||0,c:val.c||0,f:val.f||0,fib:val.fib||0,k:val.k||0};
  for(var g=0;g<DIET.length;g++){
    for(var j=0;j<DIET[g].items.length;j++){
      var it=DIET[g].items[j];
      if(it.id===id) return {p:it.p,c:it.c,f:it.f,fib:it.fib,k:it.k};
    }
  }
  return null;
}
function dayTotals(rec){
  var t={p:0,c:0,f:0,fib:0,k:0};
  Object.keys(rec.items||{}).forEach(function(id){
    var m=entryMacros(id,rec.items[id]);
    if(m){ t.p+=m.p; t.c+=m.c; t.f+=m.f; t.fib+=m.fib; t.k+=m.k; }
  });
  return t;
}
function removeAiItem(id){
  if(diet[dietDate]&&diet[dietDate].items[id]){
    delete diet[dietDate].items[id];
    save("fw_diet",diet);
    renderDiet();
  }
}

var AI_PROMPT='你是营养师。估算图中这份餐食（单份/一盘）的营养成分。只输出严格JSON对象，不要代码块、不要多余文字：{"name":"餐食名称","carbs":数字克数,"protein":数字克数,"fat":数字克数,"fiber":数字克数,"kcal":数字千卡,"note":"30字内说明与置信度"}。数值必须是数字。按盘中可见份量估算。';
function parseAiContent(content){
  var s=String(content).trim();
  if(s.indexOf("```")===0) s=s.replace(/^```[a-zA-Z]*/,"").replace(/```$/,"").trim();
  var a=s.indexOf("{"), b=s.lastIndexOf("}");
  if(a<0||b<a) throw new Error("返回内容不含JSON");
  var o=JSON.parse(s.slice(a,b+1));
  function n(k){ var v=parseFloat(o[k]); return isNaN(v)?0:Math.max(0,Math.round(v*10)/10); }
  return {name:String(o.name||"餐食").slice(0,30),carbs:n("carbs"),protein:n("protein"),fat:n("fat"),fiber:n("fiber"),kcal:n("kcal"),note:String(o.note||"").slice(0,100)};
}
function callZhipuDirect(b64){
  return fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+settings.apiKey},
    body:JSON.stringify({model:"glm-4v-flash",messages:[{role:"user",content:[
      {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},
      {type:"text",text:AI_PROMPT}
    ]}],temperature:0.1})
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.choices&&j.choices[0]&&j.choices[0].message) return parseAiContent(j.choices[0].message.content);
    throw new Error((j.error&&j.error.message)||"响应格式异常");
  });
}
function resizeToJpeg(dataUrl,maxSide,cb){
  var img=new Image();
  img.onload=function(){
    var scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    var c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*scale));
    c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.82).split(",")[1]);
  };
  img.onerror=function(){ cb(String(dataUrl).split(",")[1]||""); };
  img.src=dataUrl;
}
function analyzePhoto(b64){
  if(settings.apiKey) return callZhipuDirect(b64);
  return fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:b64})})
  .then(function(r){ return r.json().then(function(j){
    if(r.status!==200||!j.ok) throw new Error((j&&j.error)||"服务器错误");
    return j.data;
  }); });
}
function initPhoto(){
  var btn=$("btnPhoto"), inp=$("photoInput");
  if(!btn) return;
  if(!settings.apiKey&&location.protocol==="file:"){
    $("photoHint").textContent="当前以本地文件打开且未填API Key，拍照识别不可用；请在「设置」填入智谱Key，或用电脑服务器地址打开。";
    btn.disabled=true; btn.style.opacity="0.5";
    return;
  }
  $("photoHint").textContent=settings.apiKey?"直连模式：使用设置里的智谱Key，不依赖电脑。":"";
  btn.addEventListener("click",function(){ inp.click(); });
  inp.addEventListener("change",function(){
    var f=inp.files[0]; if(!f) return;
    $("photoStatus").textContent="识别中…（约5-15秒）";
    $("photoResult").classList.add("hide");
    var rd=new FileReader();
    rd.onload=function(){
      var dataUrl=String(rd.result);
      $("photoPreview").src=dataUrl; $("photoPreview").style.display="block";
      resizeToJpeg(dataUrl,1024,function(b64){
        analyzePhoto(b64).then(function(d){
          $("aiName").value=d.name||""; $("aiCarbs").value=d.carbs; $("aiProtein").value=d.protein;
          $("aiFat").value=d.fat; $("aiFiber").value=d.fiber; $("aiKcal").value=d.kcal;
          $("aiNote").textContent=d.note||"";
          $("photoStatus").textContent="识别完成：可修改数值，再点「计入当日打卡」。";
          $("photoResult").classList.remove("hide");
        }).catch(function(e){
          $("photoStatus").textContent="识别失败："+(e&&e.message||e)+"。直连模式请检查网络与Key；中转模式请确认电脑开机并运行启动器。";
        });
      });
    };
    rd.readAsDataURL(f);
    inp.value="";
  });
  $("btnAiAdd").addEventListener("click",function(){
    var num=function(id){ var v=parseFloat($(id).value); return isNaN(v)?0:Math.round(v*10)/10; };
    var item={n:$("aiName").value||"识别餐食",c:num("aiCarbs"),p:num("aiProtein"),f:num("aiFat"),fib:num("aiFiber"),k:num("aiKcal")};
    if(!diet[dietDate]) diet[dietDate]={items:{}};
    diet[dietDate].items["ai"+Date.now()]=item;
    save("fw_diet",diet);
    $("photoResult").classList.add("hide");
    $("photoPreview").style.display="none";
    $("photoStatus").textContent="已计入当日打卡 ✔";
    renderDiet();
  });
}

/* ===== 趋势 ===== */
function renderTrends(){
  var html="";
  var dates=Object.keys(train).filter(function(dt){return train[dt]&&train[dt].split;}).sort();
  var td=today(), monday=new Date(td.getTime()-((td.getDay()+6)%7)*DAY_MS);
  var thisWeek=dates.filter(function(dt){ var x=pdate(dt); return x>=monday&&x<new Date(monday.getTime()+7*DAY_MS); }).length;
  html+='<div class="card"><h2>训练出勤</h2><div class="row"><div class="cell"><div class="big">'+dates.length+'</div><div class="mut">累计训练次数</div></div><div class="cell"><div class="big">'+thisWeek+' / 3</div><div class="mut">本周（目标3次）</div></div></div>';
  if(dates.length){
    html+='<div style="margin-top:8px"><span class="mut">最近记录：</span>';
    dates.slice(-8).reverse().forEach(function(dt){
      var sp=train[dt].split, x=pdate(dt);
      html+=' <span class="tag">'+dt.slice(5)+' '+DAYS[(x.getDay()+6)%7]+' '+(sp==="push"?"推":sp==="pull"?"拉":"肩臂腹")+'</span>';
    });
    html+='</div>';
  }
  html+='</div>';

  var days14=[], met=0;
  for(var i=13;i>=0;i--){
    var d=new Date(td.getTime()-i*DAY_MS), ds=dstr(d), rec=diet[ds];
    if(!rec){ continue; }
    var pp=dayTotals(rec).p;
    days14.push({d:ds,p:pp});
    if(pp>=settings.protein) met++;
  }
  var rate=days14.length?Math.round(met/days14.length*100):0;
  html+='<div class="card"><h2>蛋白质达标（近14天）</h2><div class="big">'+rate+'% <span class="mut">（'+met+' / '+days14.length+' 个记录日 ≥'+settings.protein+'g）</span></div><div class="bar"><i style="width:'+rate+'%"></i></div></div>';

  var ws=Object.keys(weight).sort();
  html+='<div class="card"><h2>体重记录（周日晨空腹）</h2>';
  html+='<div class="row" style="align-items:flex-end"><div class="cell"><label>日期</label><input type="date" id="wtDate" value="'+dstr(today())+'"></div><div class="cell"><label>体重 kg</label><input type="number" id="wtKg" step="0.1" min="30" max="200"></div><div class="cell" style="max-width:120px"><button class="btn" style="margin-top:6px" onclick="addWeight()">保存</button></div></div>';
  if(ws.length){
    var lastW=weight[ws[ws.length-1]], prevW=ws.length>1?weight[ws[ws.length-2]]:null;
    html+='<div class="mut" style="margin-top:8px">最新 '+lastW+'kg'+(prevW!==null?'（较上次 '+(lastW-prevW>=0?"+":"")+(lastW-prevW).toFixed(1)+'kg）':"")+' · 周目标 +0.25~0.5kg</div>';
    html+='<div style="margin-top:8px">'+weightChart(ws)+'</div>';
  } else {
    html+='<div class="mut" style="margin-top:8px">尚无体重记录，周日早晨称重后录入。</div>';
  }
  html+='</div>';
  $("view-trends").innerHTML=html;
}
function addWeight(){
  var d=$("wtDate").value, v=parseFloat($("wtKg").value);
  if(!d){ alert("请选日期"); return; }
  if(isNaN(v)||v<=0){ alert("请输入体重"); return; }
  weight[d]=Math.round(v*10)/10;
  save("fw_weight",weight);
  renderTrends();
}
function weightChart(ws){
  var W=640,H=220,padL=38,padR=14,padT=18,padB=26;
  var vals=ws.map(function(k){return weight[k];});
  var lo=Math.min.apply(null,vals)-1, hi=Math.max.apply(null,vals)+1;
  if(hi-lo<2){ var mid=(lo+hi)/2; lo=mid-1; hi=mid+1; }
  var pts=ws.map(function(k,i){
    var x=ws.length===1?W/2:padL+(W-padL-padR)*i/(ws.length-1);
    var y=padT+(H-padT-padB)*(1-(weight[k]-lo)/(hi-lo));
    return {x:x,y:y};
  });
  var poly=pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:680px;height:auto;background:#fbfcfd;border:1px solid #e3e7ee;border-radius:8px">';
  svg+='<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#d8dee8"/>';
  svg+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#d8dee8"/>';
  svg+='<text x="4" y="'+(padT+4)+'" font-size="11" fill="#68707e">'+hi.toFixed(1)+'</text>';
  svg+='<text x="4" y="'+(H-padB-2)+'" font-size="11" fill="#68707e">'+lo.toFixed(1)+'</text>';
  if(ws.length>1) svg+='<polyline points="'+poly+'" fill="none" stroke="#1f6f5f" stroke-width="2"/>';
  pts.forEach(function(p,i){
    svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#1f6f5f"><title>'+ws[i]+' '+weight[ws[i]]+'kg</title></circle>';
    if(ws.length<=16) svg+='<text x="'+(p.x)+'" y="'+(H-padB+14)+'" font-size="10" fill="#68707e" text-anchor="middle">'+ws[i].slice(5)+'</text>';
  });
  svg+='</svg>';
  return svg;
}

/* ===== 导出/导入/设置 ===== */
$("btnExport").addEventListener("click",function(){
  var data={v:APP_VERSION,settings:settings,train:train,diet:diet,weight:weight};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="健身工作台备份-"+dstr(today())+".json";
  document.body.appendChild(a); a.click(); a.remove();
});
$("btnImport").addEventListener("click",function(){ $("fileImport").click(); });
$("fileImport").addEventListener("change",function(){
  var f=this.files[0]; if(!f) return;
  if(!confirm("导入将覆盖当前全部打卡数据，确定继续？")){ this.value=""; return; }
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      settings=d.settings||settings; train=d.train||{}; diet=d.diet||{}; weight=d.weight||{};
      save("fw_settings",settings); save("fw_train",train); save("fw_diet",diet); save("fw_weight",weight);
      renderAll();
    }catch(e){ alert("导入失败：文件格式错误"); }
  };
  rd.readAsText(f);
  this.value="";
});
$("btnSettings").addEventListener("click",function(){
  $("setWeek1").value=settings.week1;
  $("setProtein").value=settings.protein;
  $("setCarbs").value=settings.carbs;
  $("setFat").value=settings.fat;
  $("setFiber").value=settings.fiber;
  $("setKcal").value=settings.kcal;
  $("setApiKey").value=settings.apiKey||"";
  $("modalSettings").classList.remove("hide");
});
$("btnSettingsCancel").addEventListener("click",function(){ $("modalSettings").classList.add("hide"); });
$("btnSettingsSave").addEventListener("click",function(){
  settings.week1=$("setWeek1").value||settings.week1;
  settings.protein=parseFloat($("setProtein").value)||settings.protein;
  settings.carbs=parseFloat($("setCarbs").value)||settings.carbs;
  settings.fat=parseFloat($("setFat").value)||settings.fat;
  settings.fiber=parseFloat($("setFiber").value)||settings.fiber;
  settings.kcal=parseFloat($("setKcal").value)||settings.kcal;
  settings.apiKey=($("setApiKey").value||"").trim();
  save("fw_settings",settings);
  $("modalSettings").classList.add("hide");
  renderAll();
});

function renderAll(){
  renderToday();
  renderSchedule();
  renderTraining();
  renderDiet();
  renderTrends();
}
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  });
}
renderAll();
